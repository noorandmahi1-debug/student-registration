<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form | NUTECH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <div class="nav-wrap">
        <a class="brand" href="index.html">
            <span class="brand-mark">N</span>
            <span class="brand-text">NUTECH <small>Student Registration</small></span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="form.html" class="active">Register</a>
            <a href="thanks.html">Confirmation</a>
        </nav>
    </div>
</header>
<main>
    <div class="page-head">
        <h1>Student Registration Form</h1>
        <p>Fill in the details below. Fields marked <span class="req">*</span> are required.</p>
    </div>
    <form class="form-card" action="thanks.html" method="get">
        <div class="field-grid">
            <div class="field">
                <label for="fn">Full Name <span class="req">*</span></label>
                <input type="text" name="fullname" id="fn" placeholder="Enter your full name" required>
            </div>
            <div class="field">
                <label for="reg">Registration No <span class="req">*</span></label>
                <input type="text" name="regno" id="reg" placeholder="e.g. NUT-2026-001" required>
            </div>
            <div class="field">
                <label for="em">Email <span class="req">*</span></label>
                <input type="email" name="email" id="em" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="ph">Phone</label>
                <input type="tel" name="phone" id="ph" placeholder="03XXXXXXXXX" pattern="03[0-9]{9}">
            </div>
            <div class="field">
                <label for="age">Age</label>
                <input type="number" name="age" id="age" min="16" max="40" placeholder="16 - 40">
            </div>
            <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" name="dob" id="dob">
            </div>
            <div class="field full">
                <span class="field-label">Gender</span>
                <div class="choices">
                    <label class="choice" for="male"><input type="radio" name="gender" id="male" value="Male"> Male</label>
                    <label class="choice" for="female"><input type="radio" name="gender" id="female" value="Female"> Female</label>
                </div>
            </div>
            <div class="field">
                <label for="dept">Department</label>
                <select name="dept" id="dept">
                    <option value="AI">Artificial Intelligence (AI)</option>
                    <option value="SE">Software Engineering (SE)</option>
                    <option value="CS">Computer Science (CS)</option>
                    <option value="CY">Cyber Security (CY)</option>
                    <option value="EE">Electrical Engineering (EE)</option>
                    <option value="CE">Civil Engineering (CE)</option>
                </select>
            </div>
            <div class="field">
                <span class="field-label">Interests</span>
                <div class="choices">
                    <label class="choice" for="web"><input type="checkbox" name="interest" value="Web" id="web"> Web</label>
                    <label class="choice" for="ai"><input type="checkbox" name="interest" value="AI" id="ai"> AI</label>
                    <label class="choice" for="games"><input type="checkbox" name="interest" value="Games" id="games"> Games</label>
                </div>
            </div>
            <div class="field full">
                <label for="addr">Address</label>
                <textarea name="address" id="addr" rows="4" placeholder="House / Street, City"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <input type="submit" class="btn btn-solid" value="Register">
            <input type="reset" class="btn btn-outline" value="Clear">
            <a href="index.html" class="btn btn-outline">Back to Home</a>
        </div>
    </form>
</main>
<footer class="site-footer">
    <p>&copy; 2026 NUTECH Student Registration &middot; <a href="index.html">Home</a></p>
</footer>
</body>
</html>
